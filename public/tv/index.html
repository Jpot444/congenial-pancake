<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Treasure Theater — TV</title>
<link rel="icon" type="image/png" href="/bison.png" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/tv.css" />
<!-- The same two players the browser portal uses, and for the same reasons:
     mpegts.js opens the provider's MPEG-TS live streams, hls.js opens the
     Pi's own HLS output. Both are optional — if neither loads, the app falls
     back to the <video> element's native playback. -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
</head>
<body>

<div class="fitter">
  <!-- 1920×1080, scaled to whatever the panel is. Never reflowed: a Shield is
       always 16:9, and reflowing a 10-foot layout only ever shrinks it. -->
  <div class="stage" id="stage">

    <header class="header">
      <div class="brand-slot">
        <span class="brand">
          <img src="/bison.png" alt="" id="brandBison" />
          <span class="brand-words">
            <span class="brand-title">Treasure Theater</span>
            <span class="brand-sub">Treasure State Technology Ventures</span>
          </span>
        </span>
      </div>
      <div class="header-right">
        <span class="clock" id="clock">—</span>
        <span class="header-rule"></span>
        <span class="profile-chip">
          <span class="profile-badge" id="profileBadge">·</span>
          <span class="profile-name" id="profileName">—</span>
        </span>
        <span class="box-chip">
          <span class="box-dot" id="boxDot"></span>
          <span id="boxState">CHECKING BOX</span>
        </span>
      </div>
    </header>

    <nav class="nav" id="nav">
      <a href="#" class="pill" data-r="0" data-c="0" data-screen="live">LIVE TV</a>
      <a href="#" class="pill" data-r="0" data-c="1" data-screen="movies">MOVIES</a>
      <a href="#" class="pill" data-r="0" data-c="2" data-screen="series">SERIES</a>
      <a href="#" class="pill" data-r="0" data-c="3" data-screen="favorites">FAVORITES</a>
      <a href="#" class="pill" data-r="0" data-c="4" data-screen="archive">ARCHIVE</a>
      <a href="#" class="pill" data-r="0" data-c="5" data-screen="downloads">DOWNLOADS</a>
      <div class="nav-right">
        <a href="#" class="pill tool" data-r="0" data-c="6" data-screen="search">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
          </svg>SEARCH
        </a>
        <a href="#" class="pill tool" data-r="0" data-c="7" data-screen="multi">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="8" height="8" rx="1"></rect>
            <rect x="13" y="3" width="8" height="8" rx="1"></rect>
            <rect x="3" y="13" width="8" height="8" rx="1"></rect>
            <rect x="13" y="13" width="8" height="8" rx="1"></rect>
          </svg>MULTI-VIEW
        </a>
      </div>
    </nav>

    <div class="scroller" id="scroller">
      <div id="screen"></div>
    </div>

    <!-- Full-bleed screens (player, multi-view) live above the browse chrome. -->
    <div id="overlay"></div>

    <div class="hints" id="hints">
      <span class="version" id="version">v25.1 · shield</span>
      <span class="hintpill">
        <span><b>▲▼◀▶</b> Move</span>
        <span><b>OK</b> Watch</span>
        <span><b>BACK</b> Up a level</span>
      </span>
    </div>

    <div id="tuning"></div>
    <div id="toast"></div>

  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
